GRUB_BACKGROUND="/usr/share/grub/lcos-splash-1024x768.png"
GRUB_GFXMODE="1024x768"
GRUB_GFXPAYLOAD_LINUX=keep
# LCOS 1.0.1: ${lcos_quirks} is set at boot by /etc/grub.d/05_lcos_quirks
# from SMBIOS (empty on most machines; Dell XPS 13 DX13260 gets
# xe.enable_panel_replay=0 mem_sleep_default=s2idle). The backslash keeps it a GRUB variable.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=2 \$lcos_quirks"
# LCOS 0.9.5-6: list Windows and other installed systems in the boot menu.
# GRUB 2.12 skips os-prober unless this is false.
GRUB_DISABLE_OS_PROBER=false
