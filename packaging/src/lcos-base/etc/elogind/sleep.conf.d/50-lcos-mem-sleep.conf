# LCOS: leave the kernel's /sys/power/mem_sleep selection alone (#195).
#
# elogind 255's compiled SuspendMode is "deep s2idle"
# (src/shared/sleep-config.c, sleep_default_mode_table). On every suspend,
# write_mode() writes the first entry to /sys/power/mem_sleep. That forces
# S3 "deep" on machines whose firmware and kernel selected s2idle (HP Elite
# Dragonfly G2, and the same mechanism as the Dell XPS 13 SKU 0E53 case).
# Those machines suspend and do not resume.
#
# An empty SuspendMode= is what config_parse_sleep_mode() turns into a
# non-NULL empty list (strv_new(NULL) allocates a one-slot NULL vector; a
# NULL return is treated as out-of-memory, not as "use the default").
# parse_sleep_config() copies the compiled "deep s2idle" default only when
# the list pointer is still NULL, so this assignment keeps that default
# from coming back. write_mode() then sees an empty list and does not
# write mem_sleep. suspend_mode_supported() treats an empty list as "use
# the kernel default" and still allows suspend. SuspendState is left
# alone (not "freeze"), so older machines whose firmware prefers S3 stay
# on deep.
#
# /etc/elogind/sleep.conf.d/10-elogind.conf ships SuspendMode commented
# out and says a local file should use a higher number so it is parsed
# later. This file is 50-. A drop-in with a still higher number can set
# SuspendMode again.
#
# The XPS 13 SKU 0E53 GRUB quirk (mem_sleep_default=s2idle, plus
# xe.enable_panel_replay=0) and /usr/libexec/system-sleep/lcos-sleep stay
# as extra safety. They are not a substitute for this file, and this file
# does not replace them.

[Sleep]
SuspendMode=
