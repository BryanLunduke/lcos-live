# LCOS #201: a large copy onto a USB disk was absorbed by the page cache,
# so Thunar reported it finished and unmount/unplug left the volume dirty.
# Absolute caps, so the limit does not grow with RAM. 16 MiB starts
# background writeback; 64 MiB is where the writing process is throttled.
# The kernel accepts only one of each pair: writing *_bytes sets the
# matching *_ratio to 0, and the other way around.
# /etc/init.d/procps runs `sysctl --system` at boot and reads this
# directory. Same filename under /etc/sysctl.d overrides it.
# Background is first so it stays below the dirty cap.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
