# LCOS: allow user namespaces (Steam, Flatpak, bubblewrap, browser sandboxes,
# rootless podman). LCOS 0.8-0.9.3 ISOs installed
# /etc/sysctl.d/99-lcos-hardening.conf with user.max_user_namespaces=0.
# sysctl --system applies files in basename order across /etc/sysctl.d and
# /usr/lib/sysctl.d, so this file (99-lcos-u...) is applied after that one
# (99-lcos-h...) and wins. To turn user namespaces off again, create
# /etc/sysctl.d/99-lcos-userns.conf (same name) with user.max_user_namespaces=0.
user.max_user_namespaces=15000
