# LCOS 1.0.2 (#202). With SingleDriver on, only the first driver that
# finds a screen adds a primary screen. A second DRM device is still
# added as a GPU screen. The option is implemented by xserver-xlibre-core
# 2:25.1.11-1+lcos2 (XLibre PR #1749). Set this option to "off" in a
# later ServerFlags section to allow two drivers to each add a screen.
Section "ServerFlags"
    Option "SingleDriver" "on"
EndSection
