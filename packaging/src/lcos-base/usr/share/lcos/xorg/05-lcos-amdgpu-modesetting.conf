# LCOS 0.9 (lcos-base): drive AMD GPUs with the modesetting DDX + glamor
# instead of the XLibre amdgpu DDX (xserver-xlibre-video-amdgpu 25.1.x).
#
# Why: XLibre amdgpu 25.1.x advertises a malformed DRI3 modifier list on
# GFX9+ (Vega, Raven/Picasso, Renoir, Navi). Mesa radeonsi trusts it and
# cannot allocate GL window back buffers, so Brave Origin, Cool Retro Term
# and Maelstrom render blank/transparent. modesetting's glamor advertises
# no modifiers on AMD, so Mesa uses implicit allocation (as on Debian).
#
# MatchDriver "amdgpu" only matches GPUs bound to the amdgpu kernel driver.
# Intel, nouveau, virtio-gpu, bochs, vmwgfx and radeon-kernel (pre-GCN)
# cards are not matched and keep their previous driver.
#
# Why /usr/share and "05-": X reads /usr/share/X11/xorg.conf.d BEFORE
# /etc/X11/xorg.conf.d, and the FIRST matching OutputClass Driver wins.
# This file must sort before 10-amdgpu.conf (which says Driver "amdgpu").
# An OutputClass in /etc would come too late to change the driver.
#
# To go back to the amdgpu DDX on one machine, add a Device section in
# /etc/X11/xorg.conf.d/ (e.g. 20-amdgpu.conf):
#   Section "Device"
#       Identifier "AMD"
#       Driver "amdgpu"
#   EndSection
Section "OutputClass"
    Identifier "LCOS amdgpu uses modesetting"
    MatchDriver "amdgpu"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
EndSection
