# LCOS 0.9 (lcos-base): companion to 05-lcos-amdgpu-modesetting.conf.
# For GPUs hot-plugged after X starts, the LAST matching OutputClass
# "HotplugDriver" option wins, so this sorts after 10-amdgpu.conf
# (which sets HotplugDriver "amdgpu") to keep hot-plugged AMD GPUs on
# modesetting too.
Section "OutputClass"
    Identifier "LCOS amdgpu hotplug uses modesetting"
    MatchDriver "amdgpu"
    Option "HotplugDriver" "modesetting"
EndSection
