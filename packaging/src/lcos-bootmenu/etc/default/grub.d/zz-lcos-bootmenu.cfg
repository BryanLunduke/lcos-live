# LCOS 1.1 GRUB theme. Sourced after lcos.cfg (zz- sorts later), so the
# theme replaces the 1.0 splash. This file does not set the timeout and
# does not touch the EFI system partition.
# rEFInd, on a UEFI install, is a separate step: `lcos-bootmenu install`
# writes zz-lcos-bootmenu-uefi.cfg (hidden timeout) and the ESP files.
unset GRUB_BACKGROUND
GRUB_THEME="/usr/share/grub/themes/lcos/theme.txt"
GRUB_GFXMODE="auto"
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_TERMINAL_OUTPUT="gfxterm"
