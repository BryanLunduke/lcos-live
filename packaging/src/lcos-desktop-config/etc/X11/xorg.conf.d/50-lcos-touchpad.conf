# LCOS: tap-to-click on by default for touchpads (libinput's default is off).
# Sorts after /usr/share/X11/xorg.conf.d/40-libinput.conf, which assigns the
# libinput driver. Users can still turn tapping off in Mouse and Touchpad
# settings; that per-session setting overrides this default.
Section "InputClass"
        Identifier "LCOS touchpad tap-to-click"
        MatchIsTouchpad "on"
        MatchDriver "libinput"
        Option "Tapping" "on"
        Option "TappingDrag" "on"
EndSection
