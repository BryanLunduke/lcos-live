GRUB_BACKGROUND="/usr/share/grub/lcos-splash-1024x768.png"
GRUB_GFXMODE="1024x768"
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=2"
# LCOS 0.9.5-6: list Windows and other installed systems in the boot menu.
# GRUB 2.12 skips os-prober unless this is false.
GRUB_DISABLE_OS_PROBER=false
