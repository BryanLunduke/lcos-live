---
modules-search: [ local ]
# Second shellprocess, after GRUB. The early shellprocess stays shellprocess.conf.
instances:
- id: lcos-bootmenu
  module: shellprocess
  config: shellprocess-lcos-bootmenu.conf
sequence:
- show:
  - welcomeq
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - luksbootkeyfile
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - packages
  - shellprocess
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@lcos-bootmenu
  - umount
- show:
  - finished
branding: lcos
prompt-install: false
dont-chroot: false
oem-setup: false
