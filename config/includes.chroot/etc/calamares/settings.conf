---
modules-search: [ local ]
sequence:
- show:
  - welcomeq
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - luksbootkeyfile
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - packages
  - shellprocess
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
branding: lcos
prompt-install: false
dont-chroot: false
oem-setup: false
