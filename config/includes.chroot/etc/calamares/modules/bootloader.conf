---
# Keys from bootloader.schema.yaml (additionalProperties: false).
# installEFIFallback copies bootx64.efi on EFI only; it does NOT run i386-pc.
# Omit it (module default is true). BIOS path is fw_type != efi.
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
