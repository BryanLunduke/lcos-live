---
# LCOS 0.9.2 (#123): regenerate the target initramfs after packages and
# shellprocess, so LUKS installs get cryptsetup hooks, crypttab and the
# keyfile. With no LUKS it only rebuilds a normal initramfs.
# Runs: update-initramfs -k all -c -t (and writes UMASK=0077 first).
kernel: "all"
be_unsafe: false
