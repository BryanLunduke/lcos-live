---
dontChroot: false
timeout: 60
script:
  - name: "Remove live-only Calamares polkit rule"
    command: "rm -f /etc/polkit-1/rules.d/49-lcos-live-calamares.rules"
  - name: "Remove live-only Calamares sudoers"
    command: "rm -f /etc/sudoers.d/lcos-live-calamares"
  - name: "Remove live-only installer applications entry"
    command: "rm -f /usr/share/applications/lcos-installer.desktop"
  - name: "Remove leftover installer Desktop launchers"
    command: "sh -c 'rm -f /home/*/Desktop/lcos-installer.desktop /etc/skel/Desktop/lcos-installer.desktop'"
  - name: "Remove live-only installer desktop hook"
    command: "rm -f /lib/live/config/2000-lcos-installer-desktop"
  - name: "Write LCOS os-release"
    command: "/usr/local/sbin/lcos-write-os-release"
  - name: "LightDM: drop live autologin; keep autologin only if chosen in the installer (#89, #122)"
    command: "/usr/lib/lcos/lcos-calamares-fix-lightdm ${USER}"
  - name: "LUKS root: let cryptsetup-initramfs embed /crypto_keyfile.bin (#123)"
    command: "sh -c 'if [ -f /crypto_keyfile.bin ] && grep -q crypto_keyfile.bin /etc/crypttab 2>/dev/null; then chmod 600 /crypto_keyfile.bin; mkdir -p /etc/cryptsetup-initramfs /etc/initramfs-tools/conf.d; sed -i -e \"/^KEYFILE_PATTERN=/d\" -e \"/^CRYPTSETUP=/d\" /etc/cryptsetup-initramfs/conf-hook 2>/dev/null; printf \"CRYPTSETUP=y\\nKEYFILE_PATTERN=/crypto_keyfile.bin\\n\" >> /etc/cryptsetup-initramfs/conf-hook; echo UMASK=0077 > /etc/initramfs-tools/conf.d/lcos-luks-umask.conf; fi'"
