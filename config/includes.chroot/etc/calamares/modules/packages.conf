---
# Calamares packages module: backend must be the string "apt"
# (not a YAML list). "backend: -apt" becomes the name "-apt" and
# the module reports Bad backend.
backend: apt

# Do not refresh apt indexes during install (live image may be offline).
update_db: false
update_system: false
skip_if_no_internet: false

# operations format required by Calamares 3.3+ (top-level install:/remove: are ignored).
# LUKS tools: seeded on the live squashfs; try_install keeps offline installs working.
# Live-only packages are removed from the target. GitHub BryanLunduke/LCOS#80.
operations:
  - try_install:
      - cryptsetup
      - cryptsetup-initramfs
  - try_remove:
      - live-boot
      - live-config
      - live-config-sysvinit
      - calamares
      - calamares-settings-debian
