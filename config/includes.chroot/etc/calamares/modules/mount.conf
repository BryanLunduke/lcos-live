---
# Calamares 3.3.14 mount.schema.yaml. Without extraMounts, check_target_env_call
# chroots with no /dev /proc /sys and grub-install --target=i386-pc /dev/sda
# exits 1 (not 127). Keys from src/modules/mount/mount.conf v3.3.14.
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/log
    subvolume: /@log

btrfsSwapSubvol: /@swap

mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, compress=zstd:1 ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]
