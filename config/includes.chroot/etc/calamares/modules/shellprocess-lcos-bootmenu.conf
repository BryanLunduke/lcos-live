---
# UEFI: install rEFInd and hide GRUB (the LCOS tile chainloads it).
# BIOS: lcos-bootmenu exits 0 without writing a boot sector. The GRUB
# theme drop-in was already applied by grub-mkconfig in the bootloader
# module. Runs in the target chroot, after GRUB, while /boot/efi is
# still mounted. Does not run on a 1.0.x upgrade; those machines opt in
# with `lcos-bootmenu install`.
# The command exits 0 when rEFInd cannot be installed (no stub, no
# refind package, ESP not mounted). Calamares then finishes, and the
# machine still boots the GRUB that the bootloader module wrote.
dontChroot: false
timeout: 180
script:
  - name: "LCOS boot menu (rEFInd on UEFI)"
    command: "/usr/sbin/lcos-bootmenu install"
