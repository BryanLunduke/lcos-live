---
# Real keys from the 3.3.14 partition module (strings in
# libcalamares_viewmodule_partition.so). partitionLayout IS parsed, but
# createPartitions() sets FLAG None and never sets bios_grub; a GPT type
# GUID does not help on msdos and is not enough to prove BIOS+GPT Erase.
# defaultPartitionTableType is deliberately UNSET. Calamares then picks
# the table by firmware for Erase disk: gpt when booted UEFI, msdos when
# booted BIOS. (A fixed "msdos" here put the UEFI ESP on an MBR table.)
# BIOS stays msdos so grub-install i386-pc embeds in the post-MBR gap;
# BIOS+GPT would need a bios_grub partition, which this Calamares never
# creates. requiredPartitionTableType is also unset, so manual layouts on
# either table type are not blocked. Do not add grub-efi-amd64 meta.
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 300MiB
  minimumSize: 32MiB
  label: "EFI"

userSwapChoices:
  - none
  - small
  - suspend
  - file

luksGeneration: luks1
initialPartitioningChoice: none
initialSwapChoice: none
defaultFileSystemType: "ext4"
