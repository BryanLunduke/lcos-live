---
# Calamares 3.3.14 users page includes the hostname field.
# Default the suggestion to LCOS; the user may change it.
# Do not hide the field (location None/Transient) — Editor wants LCOS as default.
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "LCOS"

# Fresh installs must be able to use sudo (Updates / apt / admin tasks).
# Devuan's /etc/sudoers already has `%sudo ALL=(ALL:ALL) ALL` — do NOT set
# sudoersGroup (that would duplicate a sudoers.d drop-in). Just add the user
# to the existing sudo group. Bug: prior recipes omitted defaultGroups, so
# installed users were not in sudo and `sudo apt update` failed.
defaultGroups:
  - name: sudo
    must_exist: true
    system: true
  - name: audio
    must_exist: false
    system: true
  - name: video
    must_exist: false
    system: true
  - name: cdrom
    must_exist: false
    system: true
  - name: floppy
    must_exist: false
    system: true
  - name: dip
    must_exist: false
    system: true
  - name: plugdev
    must_exist: false
    system: true
  - name: netdev
    must_exist: false
    system: true
  - name: dialout
    must_exist: false
    system: true
  # Printer admin (CUPS SystemGroup is "root lpadmin"). Without it, adding a
  # printer on an installed system fails with CUPS 'forbidden'. The live user
  # already gets lpadmin via etc/live/config.conf.d/lcos.conf.
  - name: lpadmin
    must_exist: false
    system: true

# Autologin UI (GitHub #89). displaymanager writes /etc/lightdm/lightdm.conf;
# shellprocess still MUST rewrite 50-lcos.conf (drop-in survives commented main-conf).
# Default ON: installed systems autologin as the Calamares-created user.
displayAutologin: true
doAutologin: true

# LCOS #128: require a password. Without passwordRequirements Calamares
# accepts empty user/root passwords, which left the user with an empty
# password (no prompt for login/sudo) and root locked ('!').
# allowWeakPasswords: false makes a failed check block "Next".
allowWeakPasswords: false
passwordRequirements:
    minLength: 1
