---
# Fill /etc/default/grub before the bootloader module runs.
# When root is LUKS, sets GRUB_ENABLE_CRYPTODISK=y so grub-install works.
# Fixes BryanLunduke/LCOS#80.
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: false
