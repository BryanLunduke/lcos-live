[Seat:*]
# LIVE ISO only: autologin as lcos.
# Calamares shellprocess (lcos-calamares-fix-lightdm) rewrites this on install
# to the real username before umount (GitHub #89). Do not rely on displaymanager
# alone — it only edits /etc/lightdm/lightdm.conf and cannot clear this drop-in.
autologin-user=lcos
autologin-user-timeout=0
user-session=xfce
greeter-session=lightdm-gtk-greeter
