# LCOS hardening. Unprivileged bpf() stays off.
# User namespaces are left at the kernel default (LLK has CONFIG_USER_NS=y);
# Steam, Flatpak, bubblewrap, browser sandboxes and rootless podman need them.
# lcos-base also ships /usr/lib/sysctl.d/99-lcos-userns.conf, which overrides
# the user.max_user_namespaces=0 line that 0.8-0.9.3 ISOs left in this file.
kernel.unprivileged_bpf_disabled=1
