// LCOS build-time only. live-build copies this to chroot/etc/apt/apt.conf
// during the build (lb chroot_apt) and removes it afterwards, so it is NOT
// in the image. Do not move it to config/archives/*.conf.binary.
//
// Why: after the package passes, "lb chroot_archives chroot remove" writes
// the image sources (http://deb.devuan.org/merged, --mirror-binary, #163)
// and runs one apt-get update whose lists are thrown away
// (--apt-indices false). On build hosts whose egress proxy answers plain
// HTTP with "500 Internal Server Error", apt treats that as a hard error
// ("not signed") and the build stops. Sending only that host to a closed
// port turns it into a soft "Ign/W:" (exit 0). All package downloads use
// BUILD_MIRROR (https://ftp.fau.de) and are unaffected.
Acquire::http::Proxy::deb.devuan.org "http://127.0.0.1:9/";
